
<ion-content class="registro-content" [fullscreen]="true">
  
  <!-- Header con gradiente -->
  <div class="registro-header">
    <div class="registro-header-icon">
      <ion-icon name="person-add"></ion-icon>
    </div>
    <h1 class="registro-header-title">Crea tu cuenta</h1>
    <p class="registro-header-subtitle">Solo unos datos para comenzar</p>
  </div>

  <div class="registro-content-area">
    
    <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate class="registro-form">
      
      <!-- Nombre -->
      <div class="registro-input-group">
        <label class="registro-input-label">
          <ion-icon name="person-outline"></ion-icon>
          Nombre
        </label>
        <div class="registro-input-container">
          <ion-input 
            formControlName="nombre" 
            type="text" 
            placeholder="Ingresa tu nombre"
            class="registro-modern-input">
          </ion-input>
        </div>
      </div>

      <!-- Apellido -->
      <div class="registro-input-group">
        <label class="registro-input-label">
          <ion-icon name="id-card-outline"></ion-icon>
          Apellido
        </label>
        <div class="registro-input-container">
          <ion-input 
            formControlName="apellido" 
            type="text" 
            placeholder="Ingresa tu apellido"
            class="registro-modern-input">
          </ion-input>
        </div>
      </div>

      <!-- Email -->
      <div class="registro-input-group">
        <label class="registro-input-label">
          <ion-icon name="mail-outline"></ion-icon>
          Correo electrónico
        </label>
        <div class="registro-input-container">
          <ion-input 
            formControlName="email" 
            type="email" 
            placeholder="correo@ejemplo.com"
            class="registro-modern-input">
          </ion-input>
        </div>
      </div>

      <!-- Password con ojo -->
      <div class="registro-input-group">
        <label class="registro-input-label">
          <ion-icon name="lock-closed-outline"></ion-icon>
          Contraseña
        </label>
        <div class="registro-input-container">
          <ion-input
            formControlName="password"
            [type]="showPwd() ? 'text' : 'password'"
            placeholder="Mínimo 6 caracteres"
            class="registro-modern-input">
          </ion-input>
          <ion-button 
            fill="clear" 
            size="small" 
            type="button" 
            (click)="togglePwd()" 
            class="registro-toggle-pwd">
            <ion-icon [name]="showPwd() ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
          </ion-button>
        </div>
      </div>

      <!-- Error visual -->
      <div *ngIf="error()" class="registro-error-message">
        <ion-icon name="alert-circle"></ion-icon>
        <span>{{ error() }}</span>
      </div>

      <!-- Botón registrar -->
      <ion-button 
        type="submit" 
        class="registro-primary-btn"
        expand="block" 
        [disabled]="form.invalid || loading()">
        <ion-icon name="person-add" slot="start"></ion-icon>
        {{ loading() ? 'Creando cuenta…' : 'Crear cuenta' }}
      </ion-button>

      <!-- Divider -->
      <div class="registro-divider">
        <span class="registro-divider-text">¿Ya tienes cuenta?</span>
      </div>

      <!-- Link a login -->
      <div class="registro-footer">
        <a routerLink="/login" class="registro-login-link">
          <ion-icon name="log-in"></ion-icon>
          Iniciar sesión
        </a>
      </div>

    </form>
  </div>
</ion-content>
